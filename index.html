<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gift for you 🎁</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(circle at 50% 30%,#ffe3f1,#ffc2dd 60%,#ff9fc8);font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center}
  .stage{position:relative;width:min(92vw,380px);height:min(88vh,640px);display:flex;flex-direction:column;align-items:center;justify-content:center}
  h1{font-size:1.5rem;color:#8a1c55;margin-bottom:18px}
  /* GIFT BOX */
  .gift{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;animation:bob 1.2s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
  .lid{width:250px;height:54px;background:#e63950;border-radius:10px 10px 0 0;position:relative;transform-origin:left bottom;transition:transform .7s cubic-bezier(.3,1.6,.5,1),opacity .6s}
  .lid::before{content:"";position:absolute;left:50%;top:0;width:36px;height:100%;background:#ffd23f;transform:translateX(-50%)}
  .lid::after{content:"🎀";position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-size:44px}
  .body{width:230px;height:190px;background:#c9243d;border-radius:0 0 12px 12px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .body::before{content:"";position:absolute;left:50%;top:0;width:36px;height:100%;background:#ffd23f;transform:translateX(-50%)}
  .body img{position:relative;width:120px;height:120px;border-radius:50%;object-fit:cover;object-position:50% 30%;border:5px solid #fff;box-shadow:0 4px 14px #0004}
  .hint{margin-top:18px;font-size:1.2rem;color:#8a1c55;font-weight:bold}
  @keyframes bob{50%{transform:translateY(-12px)}}
  .opened .gift{animation:none}
  .opened .lid{transform:rotate(-70deg) translate(-40px,-40px);opacity:0;pointer-events:none}
  .opened .hint{display:none}
  .opened .body{animation:pop .5s forwards}
  @keyframes pop{to{transform:scale(.2);opacity:0}}
  /* MONKEY */
  .reveal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transform:scale(.3);transition:transform .6s cubic-bezier(.3,1.7,.5,1) .4s,opacity .3s .4s}
  .opened .reveal{opacity:1;transform:scale(1);pointer-events:auto}
  .monkey{position:relative;width:260px;height:340px;animation:dance .5s ease-in-out infinite alternate .9s}
  @keyframes dance{from{transform:rotate(-5deg) translateY(0)}to{transform:rotate(5deg) translateY(-10px)}}
  .tail{position:absolute;right:-38px;bottom:30px;width:70px;height:110px;border:14px solid #7a4a25;border-left-color:transparent;border-bottom-color:transparent;border-radius:50%;transform:rotate(25deg)}
  .torso{position:absolute;left:50%;bottom:0;width:150px;height:170px;transform:translateX(-50%);background:#8b5a2b;border-radius:70px 70px 40px 40px}
  .belly{position:absolute;left:50%;bottom:12px;width:90px;height:110px;transform:translateX(-50%);background:#e8c291;border-radius:50px 50px 30px 30px}
  .arm{position:absolute;bottom:80px;width:36px;height:120px;background:#8b5a2b;border-radius:20px;transform-origin:top center}
  .arm.l{left:18px;top:150px;animation:wl .4s ease-in-out infinite alternate .9s}
  .arm.r{right:18px;top:150px;animation:wr .4s ease-in-out infinite alternate .9s}
  @keyframes wl{from{transform:rotate(30deg)}to{transform:rotate(-40deg)}}
  @keyframes wr{from{transform:rotate(-30deg)}to{transform:rotate(40deg)}}
  .head{position:absolute;left:50%;top:0;width:190px;height:190px;transform:translateX(-50%)}
  .ear{position:absolute;top:50px;width:62px;height:62px;border-radius:50%;background:#8b5a2b;border:9px solid #e8c291}
  .ear.l{left:-22px}.ear.r{right:-22px}
  .face{position:absolute;inset:0;border-radius:50%;background:#e8c291;border:8px solid #8b5a2b;overflow:hidden}
  .face img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
  .caption{margin-top:14px;font-size:1.7rem;font-weight:bold;color:#8a1c55;text-shadow:0 2px 0 #fff}
  .again{margin-top:10px;padding:10px 22px;border:0;border-radius:99px;background:#8a1c55;color:#fff;font-size:1rem;cursor:pointer}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

</div>

<script>
const stage = document.getElementById('stage');
const gift = document.getElementById('gift');
const title = document.getElementById('title');
let audioCtx, loop;

// Monkey chatter: "ooh-ooh aah-aah" jaisi awaaz Web Audio se
function chatter(){
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  const t0 = audioCtx.currentTime;
  for(let i=0;i<10;i++){
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sawtooth';
    const t = t0 + i*0.14;
    o.frequency.setValueAtTime(i%2 ? 520 : 760, t);
    o.frequency.exponentialRampToValueAtTime(i%2 ? 380 : 980, t+0.1);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.12);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t+0.13);
  }
}

// "Sushma monkey khe khe" bolne wali voice (browser ki speech)
function say(){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance('Sushma monkey, khe khe khe khe');
  u.rate = 1.1; u.pitch = 1.9; u.volume = 1;
  speechSynthesis.speak(u);
}

// Agar apni recording ho: index.html ke saath khekhe.mp3 rakho, wo chalegi
const custom = new Audio('khekhe.mp3');
let customOK = false;
custom.addEventListener('canplaythrough', () => customOK = true);

function playSound(){
  if(customOK){ custom.currentTime = 0; custom.play(); return; }
  chatter(); say();
}

gift.addEventListener('click', () => {
  stage.classList.add('opened');
  title.textContent = 'SURPRISE! 🎉';
  playSound();
  clearInterval(loop);
  loop = setInterval(playSound, 3500);
});

document.getElementById('again').addEventListener('click', () => {
  clearInterval(loop); speechSynthesis.cancel(); custom.pause();
  stage.classList.remove('opened');
  title.textContent = 'Tumhare liye ek surprise hai 🎁';
});
</script>
